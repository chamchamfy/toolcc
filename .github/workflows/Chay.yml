name: 'BUILD OVERLAY'

on: 
  workflow_dispatch:

jobs:
  build:
    name: 'Xem quá trình'
    permissions: write-all
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 'Xây dựng'
        run: |
          chmod +x .github/* 2>/dev/null || true
          NG="$(date +"%y%m%d")"
          echo "PB=$NG" >> $GITHUB_ENV
          .github/Reo 2>&1 | tee log.txt

      - name: 'Tải lên'
        uses: actions/upload-artifact@v6
        with:
          name: overlay.zip
          path: signed/*
          if-no-files-found: warn

      - name: 'Overlay'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="Overlay_V1.${{ env.PB }}"
          gh release create "$TAG" --prerelease --title "Overlay V1.${{ env.PB }}" --notes "Release Overlay build ${{ env.PB }}" || true
          gh release upload "$TAG" OV/* --clobber

      - name: 'Flash Overlay'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="VH_XIAOMI_V1.${{ env.PB }}"
          gh release create "$TAG" --prerelease --title "VH_XIAOMI V1.${{ env.PB }}" --notes "Flash Overlay build ${{ env.PB }}" || true
          gh release upload "$TAG" UP/* --clobber

      - name: 'Log'
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Xem-Log-${{ env.PB }}
          path: log.txt
          retention-days: 3